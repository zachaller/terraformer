# Publishes a GitHub release, either:
#
# - from the Actions tab: Release → Run workflow (on main). It tags the
#   current commit with the version in android/app/build.gradle, or
# - by pushing a version tag: git tag v0.14.0 && git push origin v0.14.0
#   The tag must match versionName in android/app/build.gradle.
#
# Versions with a hyphen (0.15.0-beta1) are published as pre-releases.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Work out the tag
        run: |
          tag="v$(scripts/version.sh)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName in android/app/build.gradle ($tag)"
              exit 1
            fi
          else
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Run releases from main, not $GITHUB_REF_NAME"
              exit 1
            fi
            if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
              echo "::error::$tag is already released: bump versionName (and versionCode) in android/app/build.gradle first"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      release: true
    secrets: inherit

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      # Creates the tag on this commit if it doesn't exist yet (Run workflow).
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(needs.check.outputs.tag, '-') }}
          fail_on_unmatched_files: true
