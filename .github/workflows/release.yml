# Publishes a GitHub release when a version tag is pushed:
#
#   git tag v0.14.0 && git push origin v0.14.0
#
# The tag must match versionName in android/app/build.gradle. Tags with a
# hyphen (v0.15.0-beta1) are published as pre-releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app's version
        run: |
          version="$(scripts/version.sh)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version in android/app/build.gradle"
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      release: true
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
