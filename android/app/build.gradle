plugins {
    id "com.android.application"
}

android {
    namespace "com.zachaller.terraformer"
    compileSdk 36
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.zachaller.terraformer"
        minSdk 23
        targetSdk 36
        versionCode 47
        versionName "0.17.2"
    }

    // Release builds are signed with the upload key when TERRAFORMER_KEYSTORE
    // (and its passwords) are set, as the release workflow does from secrets.
    signingConfigs {
        release {
            def keystore = System.getenv("TERRAFORMER_KEYSTORE")
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv("TERRAFORMER_KEYSTORE_PASSWORD")
                keyAlias System.getenv("TERRAFORMER_KEY_ALIAS")
                keyPassword System.getenv("TERRAFORMER_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("TERRAFORMER_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        // Compress the Go native libraries; makes the APK much smaller to download.
        jniLibs.useLegacyPackaging = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Built from the Go code by scripts/build-android.sh (ebitenmobile bind).
    implementation files("libs/terraformer.aar")
}
